<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Subtle Water Waves -->
  <path d="M25 105 Q45 95 65 105 T105 105 T140 105" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" />
  <path d="M20 120 Q45 110 70 120 T120 120 T145 120" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2.5" stroke-linecap="round" />

  <!-- Back Fin / Ekor -->
  <path d="M42 80 L22 62 C26 75 26 85 22 98 Z" fill="url(#finGrad)" />

  <!-- Dorsal Fin / Sirip Atas -->
  <path d="M65 58 Q85 45 108 55 Q92 58 75 62 Z" fill="url(#finGrad)" />

  <!-- Ventral Fin / Sirip Bawah -->
  <path d="M75 98 Q90 108 102 100 Q90 98 80 94 Z" fill="url(#finGrad)" />

  <!-- Fish Body -->
  <path d="M38 80 C50 60 90 55 124 74 C128 77 128 83 124 86 C90 105 50 100 38 80 Z" fill="url(#fishGrad)" />

  <!-- Pectoral Fin / Sirip Dada -->
  <path d="M82 82 Q96 82 100 90 Q88 92 82 82 Z" fill="url(#finGrad)" opacity="0.9" />

  <!-- Eye -->
  <circle cx="114" cy="76" r="4.5" fill="#0f172a" />
  <circle cx="115.5" cy="74.5" r="1.5" fill="#ffffff" />

  <!-- Gills & Scales Details -->
  <path d="M102 70 Q97 80 102 90" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M85 70 Q81 76 85 82" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  <path d="M72 74 Q68 80 72 86" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

  <!-- Small Water Bubble -->
  <circle cx="128" cy="65" r="3" fill="#ffffff" opacity="0.6" />
  <circle cx="135" cy="58" r="2" fill="#ffffff" opacity="0.5" />
</svg>